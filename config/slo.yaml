service: day13-l3b-monitoring-llmops-lab
primary_slo:
  name: fast_successful_requests
  window: 28d
  sli:
    good_event: 'event == "response_sent" and latency_ms <= 3000'
    total_event: 'event == "request_received"'
  target_percent: 99.5
  error_budget_percent: 0.5
  baseline:
    measured_at: "2026-09-30"
    sample_requests: 20
    latency_p95_ms: 1163
    ttft_p95_ms: 55
  error_budget:
    assumed_requests_per_window: 10000
    allowed_bad_requests: 50
    calculation: "10000 * (1 - 0.995) = 50"
  rationale: >-
    Baseline P95 là 1163 ms, nên ngưỡng 3000 ms có khoảng đệm cho biến động nhưng vẫn
    phát hiện suy giảm rõ rệt. Mục tiêu 99.5% cho phép tối đa 0.5% request lỗi hoặc chậm;
    với 10,000 request trong 28 ngày, error budget là 50 request.
guardrails:
  error_rate_pct_max: 2
  daily_cost_usd_max: 2.5
  quality_score_avg_min: 0.75
  retrieval_success_rate_pct_min: 90
